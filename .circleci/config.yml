version: 2.1

jobs:
  build:
    macos:
      xcode: "27.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Build iOS app
          command: >-
            xcodebuild
            -project GamingNews-26.xcodeproj
            -scheme GamingNews
            -destination 'generic/platform=iOS Simulator'
            CODE_SIGNING_ALLOWED=NO
            build

workflows:
  build:
    jobs:
      - build
